name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: FarCry4Camera
          path: build/Release/FarCry4Camera.dll
